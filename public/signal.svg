<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The signal, not the emblem. A real bat-signal is a lamp with a stencil in
       front of it, so the mark is the part where light is *missing* — dark on
       amber. At 16px that reads as a lit lamp; an amber bat on a dark square
       would just read as an unidentifiable blob.

       Paths are the same silhouette as app/utils/emblem.ts (240x100 space), mapped
       into this square by the transform below. -->
  <defs>
    <radialGradient id="lamp" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffc960" />
      <stop offset="62%" stop-color="#e0a93f" />
      <stop offset="100%" stop-color="#b07f23" />
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#lamp)" />

  <g transform="translate(12.02,36.38) scale(0.31667)" fill="#080a0d">
    <path d="M120 16 L126.5 2 L132 20 C140 13 149.5 13.5 158 22 C176 8 205 6 235 13 C217 23 206.5 30 196 45 C190 32 181.5 34 170 50 C164 40 155 42 145.5 58 C139 50 130 54 126 68 L120 80 Z" />
    <path
      d="M120 16 L126.5 2 L132 20 C140 13 149.5 13.5 158 22 C176 8 205 6 235 13 C217 23 206.5 30 196 45 C190 32 181.5 34 170 50 C164 40 155 42 145.5 58 C139 50 130 54 126 68 L120 80 Z"
      transform="translate(240,0) scale(-1,1)"
    />
  </g>
</svg>
